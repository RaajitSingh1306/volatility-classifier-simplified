services:
  - type: web
    name: volatility-classifier-simplified
    runtime: python
    buildCommand: pip install -r requirements.txt && python run.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
